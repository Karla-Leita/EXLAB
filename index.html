<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscaminas Clásico</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <header class="top-bar">
            <h1>Buscaminas</h1>
            <div class="controls">
                <label for="difficulty">Dificultad:</label>
                <select id="difficulty">
                    <option value="easy">Principiante (9 x 9, 10 minas)</option>
                    <option value="medium">Intermedio (16 x 16, 40 minas)</option>
                    <option value="hard">Experto (16 x 30, 99 minas)</option>
                </select>
                <button id="reset-btn">Nuevo juego</button>
            </div>
            <div class="status-panel">
                <div class="status-item">
                    <span class="status-label">⛯ Minas:</span>
                    <span id="mines-left" class="status-value">000</span>
                </div>
                <div class="status-item">
                    <span class="status-label">⏱️ Tiempo:</span>
                    <span id="timer" class="status-value">000</span>
                </div>
            </div>
        </header>
        <main>
            <div id="message" role="status" aria-live="polite"></div>
            <div id="board" class="board" role="grid" aria-label="Tablero de buscaminas"></div>
        </main>
        <footer>
            <p>Haz clic para descubrir una casilla. Usa clic derecho o pulsa <kbd>F</kbd> con una casilla seleccionada para marcar o desmarcar una bandera.</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
